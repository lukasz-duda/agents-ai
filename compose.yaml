name: agents-ai

services:

  ollama:
    container_name: ollama
    image: ollama/ollama
    volumes:
      - ./ollama:/root/.ollama

  proxy:
    container_name: ollama-proxy
    image: mitmproxy/mitmproxy
    entrypoint: ["mitmdump"]
    command:
      - --mode
      - reverse:http://ollama:11434
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8080"
      - --flow-detail
      - "4"
    ports:
      - 11434:8080